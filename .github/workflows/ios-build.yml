name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK_VERSION"
          MAJOR=${SDK_VERSION%%.*}
          if (( MAJOR < 26 )); then
            echo "iOS 26 SDK or later is required."
            exit 1
          fi

      - name: Prepare iOS assets
        run: bash scripts/prepare_assets.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project and schemes
        run: xcodebuild -project R4.xcodeproj -list

      - name: Build R4 for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project R4.xcodeproj \
            -scheme R4 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
