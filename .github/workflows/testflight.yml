name: TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      R4_PROVISIONING_PROFILE_BASE64: ${{ secrets.R4_PROVISIONING_PROFILE_BASE64 }}
      R4_KEYBOARD_PROVISIONING_PROFILE_BASE64: ${{ secrets.R4_KEYBOARD_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK_VERSION"
          MAJOR=${SDK_VERSION%%.*}
          if (( MAJOR < 26 )); then
            echo "iOS 26 SDK or later is required for App Store Connect upload."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            APPLE_TEAM_ID
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            R4_PROVISIONING_PROFILE_BASE64
            R4_KEYBOARD_PROVISIONING_PROFILE_BASE64
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi

      - name: Prepare iOS assets
        run: bash scripts/prepare_assets.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple Distribution certificate
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/r4-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install and validate provisioning profiles
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          APP_PROFILE_TMP="$RUNNER_TEMP/r4.mobileprovision"
          KEYBOARD_PROFILE_TMP="$RUNNER_TEMP/r4-keyboard.mobileprovision"
          printf '%s' "$R4_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_TMP"
          printf '%s' "$R4_KEYBOARD_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$KEYBOARD_PROFILE_TMP"
          APP_PLIST="$RUNNER_TEMP/r4-profile.plist"
          KEYBOARD_PLIST="$RUNNER_TEMP/r4-keyboard-profile.plist"
          security cms -D -i "$APP_PROFILE_TMP" > "$APP_PLIST"
          security cms -D -i "$KEYBOARD_PROFILE_TMP" > "$KEYBOARD_PLIST"
          APP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$APP_PLIST")
          KEYBOARD_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$KEYBOARD_PLIST")
          APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$APP_PLIST")
          KEYBOARD_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$KEYBOARD_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$APP_PLIST")
          KEYBOARD_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$KEYBOARD_PLIST")
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$APP_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$KEYBOARD_PLIST"
          [[ "$APP_IDENTIFIER" == "${APPLE_TEAM_ID}.com.morningcoffeelabs.r4" ]]
          [[ "$KEYBOARD_IDENTIFIER" == "${APPLE_TEAM_ID}.com.morningcoffeelabs.r4.keyboard" ]]
          [[ "$APP_NAME" == "R4 App Store" ]]
          [[ "$KEYBOARD_NAME" == "R4 Keyboard" ]]
          cp "$APP_PROFILE_TMP" "$PROFILE_DIR/$APP_UUID.mobileprovision"
          cp "$KEYBOARD_PROFILE_TMP" "$PROFILE_DIR/$KEYBOARD_UUID.mobileprovision"
          echo "R4_PROFILE_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "R4_KEYBOARD_PROFILE_NAME=$KEYBOARD_NAME" >> "$GITHUB_ENV"
          echo "Validated app profile: $APP_NAME ($APP_UUID)"
          echo "Validated keyboard profile: $KEYBOARD_NAME ($KEYBOARD_UUID)"

      - name: Show Release signing settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project R4.xcodeproj -target R4 -configuration Release -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM'
          xcodebuild -project R4.xcodeproj -target R4Keyboard -configuration Release -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM'

      - name: Archive R4
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project R4.xcodeproj \
            -scheme R4 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/R4.xcarchive" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.morningcoffeelabs.r4</key><string>${R4_PROFILE_NAME}</string>
              <key>com.morningcoffeelabs.r4.keyboard</key><string>${R4_KEYBOARD_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Upload archive to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/R4.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
