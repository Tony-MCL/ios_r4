name: R4
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"

targets:
  R4:
    type: application
    platform: iOS
    sources:
      - path: R4
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morningcoffeelabs.r4
        INFOPLIST_FILE: R4/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: R4/Supporting/R4.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
      configs:
        Release:
          DEVELOPMENT_TEAM: KX466RJMXK
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: R4 App Store
    dependencies:
      - target: R4Keyboard
        embed: true

  R4Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: R4Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morningcoffeelabs.r4.keyboard
        INFOPLIST_FILE: R4Keyboard/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: R4Keyboard/Supporting/R4Keyboard.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SKIP_INSTALL: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: KX466RJMXK
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: R4 Keyboard

schemes:
  R4:
    build:
      targets:
        R4: all
        R4Keyboard: all
    run:
      config: Debug
    archive:
      config: Release
